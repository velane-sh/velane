name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  control-plane:
    name: Control plane tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velane
          POSTGRES_PASSWORD: velane
          POSTGRES_DB: velane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velane -d velane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://velane:velane@localhost:5432/velane_test?sslmode=disable
      TEST_REDIS_URL: localhost:6379
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/control-plane/go.mod
          cache-dependency-path: services/control-plane/go.sum

      - name: Copy platform libraries
        working-directory: .
        run: make copy-platform-libs

      - name: Run unit and integration tests
        run: |
          go test -count=1 ./internal/store/redis
          mapfile -t packages < <(
            go list ./... |
              sed \
                -e '\|/internal/executor/firecracker$|d' \
                -e '\|/internal/store/redis$|d'
          )
          go test -count=1 -p 1 "${packages[@]}"

      - name: Build
        run: go build ./...

  go-services:
    name: Go tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - cli
          - mcp-server
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

  sandbox-services:
    name: Sandbox service tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - sandbox-host-agent
          - sandbox-host-watchdog
          - sandbox-guest-init
          - sandbox-image-builder
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache: false

      - name: Run unit tests
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

  sandbox-privileged-integration:
    name: Sandbox privileged integration
    # Configure this repository variable with a dedicated, self-hosted Linux
    # runner label. The runner must be isolated, root-capable, KVM-enabled, and
    # include Firecracker, jailer, and nftables. Without it, this contract is
    # intentionally skipped rather than emulated on a hosted runner.
    if: vars.SANDBOX_PRIVILEGED_RUNNER != ''
    runs-on: ${{ vars.SANDBOX_PRIVILEGED_RUNNER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go for host agent
        uses: actions/setup-go@v5
        with:
          go-version-file: services/sandbox-host-agent/go.mod
          cache-dependency-path: services/sandbox-host-agent/go.sum

      - name: Run host-agent KVM integration contract
        run: sudo services/sandbox-host-agent/scripts/run-privileged-integration.sh

      - name: Run watchdog nftables integration contract
        run: sudo services/sandbox-host-watchdog/scripts/run-privileged-integration.sh

  sandbox-artifacts:
    name: Sandbox artifact build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - sandbox-host-agent
          - sandbox-host-watchdog
          - sandbox-guest-init
          - sandbox-image-builder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build OCI packaging artifact
        run: >-
          docker build
          --file services/${{ matrix.service }}/Dockerfile
          --tag velane-${{ matrix.service }}:ci
          services/${{ matrix.service }}

  frontends:
    name: Frontend build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin
          - embed-dashboard
          - web-ide
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  platform-libraries:
    name: Platform library tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Bun tests
        run: |
          if rg --files platform-libraries/bun | rg -q '\.(test|spec)\.ts$'; then
            cd platform-libraries/bun
            bun test
          else
            echo "No Bun platform-library tests found"
          fi

      - name: Run Python tests
        run: |
          if rg --files platform-libraries/python | rg -q '(^|/)(test_.*|.*_test)\.py$'; then
            python -m pytest -v platform-libraries/python
          else
            echo "No Python platform-library tests found"
          fi
