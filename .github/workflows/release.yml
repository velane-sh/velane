name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (stays on 0.7.x with patch until you choose minor/major)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ inputs.bump }}

  build-and-push:
    needs: bump-version
    uses: ./.github/workflows/_build-images.yml
    with:
      version: ${{ needs.bump-version.outputs.new_version }}
    secrets: inherit

  publish-release:
    needs: [bump-version, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.bump-version.outputs.new_tag }}" \
            --title "${{ needs.bump-version.outputs.new_tag }}" \
            --generate-notes \
            --latest
