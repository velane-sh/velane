name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in the 0.9.x series, for example 0.9.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  validate-version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^0\.9\.[0-9]+$ ]]; then
            echo "Version must be in the 0.9.x series, for example 0.9.2"
            exit 1
          fi

          release_tag="v$RELEASE_VERSION"
          if git rev-parse "$release_tag" >/dev/null 2>&1; then
            echo "Release tag $release_tag already exists"
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: validate-version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yml
    with:
      version: ${{ needs.validate-version.outputs.release_version }}
    secrets: inherit

  publish-release:
    needs: [validate-version, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.validate-version.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.validate-version.outputs.release_tag }}" \
            --generate-notes \
            --latest
